<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Chain Shop & Co.</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="login" class="login-body">
  <div class="login-box">
    <h2>Chain Shop & Co.</h2>
    <p>Sign in to the CRM</p>
    <label>Login as</label>
    <select id="role"><option value="admin">Admin</option><option value="staff">Staff</option></select>
    <label>Username</label>
    <input id="username" placeholder="Username">
    <label>Password</label>
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <small>Demo: admin / admin123 &nbsp;|&nbsp; staff / staff123</small>
  </div>
  <script src="../js/app.js"></script>
</body>
</html>
